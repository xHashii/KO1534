# ------------------------------------------------------------------
# Knight Online 1534 - Login Server configuration (sample)
# Copy to ./config/LogInServer.ini and edit. Do NOT commit real credentials.
# ------------------------------------------------------------------

[SETTINGS]
PORT = 15100
# 1 = auto-register new accounts on first login (original 1534 ACCOUNT_LOGIN
# behaviour). 0 = require accounts to already exist.
AUTO_REGISTER = 1

[DOWNLOAD]
URL = ftp.yoursite.net
PATH = /patches/

# MySQL connection (ported from the original ODBC block).
# For local dev, point these at the docker-compose.yml MySQL instance.
[ODBC]
NAME = KO1534_login
HOST = 127.0.0.1
PORT = 3306
USER = ko
PASSWORD = ko_password_change_me
DATABASE = KO1534
POOLING = true
CONNECTION_TIMEOUT = 15
COMMAND_TIMEOUT = 30

[SERVER_LIST]
COUNT = 3

# Main server (GroupID = 0)
SERVER_00 = 127.0.0.1
LANIP_00 = 127.0.0.1
NAME_00 = Ko1534 Server
ID_00 = 1
GROUPID_00 = 0
PREMLIMIT_00 = 3000
FREELIMIT_00 = 3000
KING1_00 =
KING2_00 =
KINGMSG1_00 =
KINGMSG2_00 =

# Sub-server 1 (GroupID = 1)
SERVER_01 = 127.0.0.1
LANIP_01 = 127.0.0.1
NAME_01 = Ko1534 Server
ID_01 = 2
GROUPID_01 = 1
PREMLIMIT_01 = 3000
FREELIMIT_01 = 3000
KING1_01 =
KING2_01 =
KINGMSG1_01 =
KINGMSG2_01 =

# Sub-server 2 (GroupID = 1, same as main server ID)
SERVER_02 = 127.0.0.1
LANIP_02 = 127.0.0.1
NAME_02 = Ko1534 Server
ID_02 = 3
GROUPID_02 = 1
PREMLIMIT_02 = 3000
FREELIMIT_02 = 3000
