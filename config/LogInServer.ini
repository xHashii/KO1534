; ---------------------------------------------------------------------------
; KO1534 - LogInServer sample configuration.
; Copy to LogInServer.ini next to the executable (the server reads ./LogInServer.ini)
; and edit.  Never commit a file containing real credentials.
; ---------------------------------------------------------------------------

[SETTINGS]
PORT = 15100

; MySQL 8.4 connection (native libmysqlclient, no ODBC/DSN required).
[DATABASE]
HOST = 127.0.0.1
PORT = 3306
NAME = KO1534
USER = ko1534
PASSWORD = change_me
; latin1 keeps the original 1:1 byte semantics (see docs/MYSQL_NOTES.md).
CHARSET = latin1
CONNECT_TIMEOUT = 15

[DOWNLOAD]
URL = ftp.yoursite.net
PATH = /patches/

[SERVER_LIST]
COUNT = 1

SERVER_00 = 127.0.0.1
LANIP_00 = 127.0.0.1
NAME_00 = KO1534 - Karus
ID_00 = 1
GROUPID_00 = 1
PREMLIMIT_00 = 3000
FREELIMIT_00 = 3000
KING1_00 =
KING2_00 =
KINGMSG1_00 =
KINGMSG2_00 =

[NEWS]
