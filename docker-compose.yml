# Local MySQL 8 for the Ko1534 rewrite.
#   docker compose up -d
# The migrations/ directory is mounted to docker-entrypoint-initdb.d, so
# schema and data auto-load on first startup (fresh volume).

services:
  mysql:
    image: mysql:8.0
    container_name: ko1534-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: KO1534
      MYSQL_USER: ko
      MYSQL_PASSWORD: ko_password_change_me
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-allowed-packet=256M
    ports:
      - "3306:3306"
    volumes:
      - ko1534-mysql-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_change_me"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ko1534-mysql-data:
